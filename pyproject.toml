[project]
name = "ocr-mcp-pro"
version = "0.2.0"
description = "Multi-engine OCR MCP server with auto-install and China mirror support. 支持自动安装、国内镜像加速的多引擎 OCR MCP 服务器。"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.27",
    "rapidocr-onnxruntime>=1.4",
    "onnxruntime>=1.26",
    "pytesseract>=0.3.13",
    "Pillow>=11",
    "numpy>=2",
    "pymupdf>=1.27",
    "jiwer>=4",
    "opencv-python-headless>=4.10",
    "pyperclip>=1.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["ocr_mcp"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.12"
include = ["src/ocr_mcp"]
reportMissingModuleSource = "none"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "C4", "SIM"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S311"]
